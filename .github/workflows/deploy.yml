name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          DEPLOY_BASE: /wedding-app/
          # klucz publishable jest z założenia jawny (trafia do bundla JS),
          # więc nie musi być sekretem
          VITE_SUPABASE_URL: https://grirunwweekjidjuhvjy.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_6XIU5XBfJTgSmm2PjKRm4A_6nafah1R

      # SPA fallback: GitHub Pages serwuje 404.html dla nieznanych ścieżek,
      # a router po stronie klienta przejmuje routing
      - run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
